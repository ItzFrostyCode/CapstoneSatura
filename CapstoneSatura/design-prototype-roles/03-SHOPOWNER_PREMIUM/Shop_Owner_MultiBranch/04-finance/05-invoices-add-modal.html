<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Sutura - Create Invoice Modal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #1A1A1A; --primary-hover: #333333; --bg: #FFFFFF; --surface: #F9FAFB;
      --text-main: #111827; --text-muted: #6B7280; --border: #E5E7EB;
      --overlay: rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background-color: var(--surface); color: var(--text-main); display: flex; width: 100%; min-height: 100vh; overflow-x: hidden; position: relative; }

    /* Blurred background layout */
    .sidebar { width: 260px; background-color: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { height: 72px; display: flex; align-items: center; padding: 0 24px; gap: 12px; border-bottom: 1px solid var(--border); }
    .logo-icon { background-color: var(--primary); color: white; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
    .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .nav-list { padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; font-size: 15px; font-weight: 500; color: var(--text-muted); text-decoration: none;}
    .nav-item.active { background-color: var(--primary); color: white; }
    
    .main { flex-grow: 1; display: flex; flex-direction: column; filter: blur(8px); pointer-events: none; background: var(--surface); }
    .header { height: 72px; background-color: var(--bg); border-bottom: 1px solid var(--border); }

    /* Modal Overlay */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    
    .modal { background-color: var(--bg); width: 640px; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .modal-header { padding: 32px 40px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #111827; }
    
    .modal-close { background: #F8FAFC; border: none; color: #9CA3AF; cursor: pointer; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .modal-close:hover { color: var(--primary); background: #F1F5F9; }
    
    .modal-body { padding: 40px; overflow-y: auto; }
    
    .form-group { margin-bottom: 24px; }
    .form-row { display: flex; gap: 20px; margin-bottom: 24px; }
    .form-row .form-group { flex: 1; margin-bottom: 0; }
    
    label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
    input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Outfit'; font-size: 15px; outline: none; background: var(--surface); transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    select { appearance: none; }
    
    .select-wrapper { position: relative; }
    .select-icon { position: absolute; right: 16px; top: 14px; pointer-events: none; color: var(--text-muted); }
    textarea { height: 100px; padding: 12px 16px; resize: none; }

    .input-with-addon { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); transition: border-color 0.2s; }
    .input-with-addon:focus-within { border-color: var(--primary); }
    .input-with-addon input { border: none; border-radius: 0; background: transparent; }
    .input-addon { background-color: var(--bg); padding: 0 16px; font-size: 15px; font-weight: 500; color: var(--text-muted); border-right: 1px solid var(--border); height: 44px; display: flex; align-items: center; }

    .modal-footer { padding: 32px 40px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 16px; background-color: var(--bg); }
    .btn-secondary { background: #F8FAFC; border: 1px solid #F1F5F9; color: #111827; height: 56px; padding: 0 32px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #F1F5F9; }
    .btn-primary { background: #1A1A1A; color: white; border: none; height: 56px; padding: 0 32px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    .btn-primary:hover { background: #000000; transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header"><div class="logo-icon"><i data-lucide="scissors" style="width:20px;"></i></div><div class="logo-text">Sutura</div></div>
    <nav class="nav-list">
      <a href="../00-dashboard/01-dashboard.html" class="nav-item "><i data-lucide="layout-dashboard" style="width: 20px;"></i> Dashboard</a>
      <a href="../01-clients-crm/02-customers-tab.html" class="nav-item "><i data-lucide="users" style="width: 20px;"></i> Customers</a>
      <a href="../02-production/01-job-orders-tab.html" class="nav-item "><i data-lucide="briefcase" style="width: 20px;"></i> Production</a>
      <a href="../03-supply-chain/01-inventory-tab.html" class="nav-item "><i data-lucide="package" style="width: 20px;"></i> Supply Chain</a>
      <a href="../04-finance/01-sales-tab.html" class="nav-item active"><i data-lucide="credit-card" style="width: 20px;"></i> Finance</a>
      <a href="../00-dashboard/08-branch-management.html" class="nav-item "><i data-lucide="git-branch" style="width: 20px;"></i> Branches</a>
      <a href="../05-settings/01-settings-tab.html" class="nav-item "><i data-lucide="settings" style="width: 20px;"></i> Settings</a>
    </nav>
  </aside>
  <main class="main"><header class="header"></header></main>

  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Create Invoice</div>
        <button class="modal-close"><i data-lucide="x" style="width: 24px;"></i></button>
      </div>
      <div class="modal-body">
        
        <div class="form-row">
          <div class="form-group">
            <label>Customer Name</label>
            <div class="select-wrapper">
              <select>
                <option>Select Customer...</option>
                <option>Alexander McQueen</option>
                <option>Maria Santos</option>
                <option>Juan Dela Cruz</option>
              </select>
              <i data-lucide="chevron-down" class="select-icon" style="width: 16px;"></i>
            </div>
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="date" value="2023-11-15" />
          </div>
        </div>

        <div class="form-group">
          <label>Invoice Items / Description</label>
          <textarea placeholder="e.g. Custom 3-Piece Suit (Navy Wool), Alterations..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Total Amount ($)</label>
            <div class="input-with-addon">
              <div class="input-addon">$</div>
              <input type="number" placeholder="600.00" />
            </div>
          </div>
          <div class="form-group">
            <label>Status</label>
            <div class="select-wrapper">
              <select>
                <option>Unpaid</option>
                <option>Paid (Deposit)</option>
                <option>Paid (Full)</option>
              </select>
              <i data-lucide="chevron-down" class="select-icon" style="width: 16px;"></i>
            </div>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn-secondary">Cancel</button>
        <button class="btn-primary">Generate Invoice</button>
      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>

</body>
</html>
