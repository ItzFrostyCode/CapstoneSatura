<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1.0">
  <title>Sutura | Join the Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #1A1A1A; --accent: #2C6BED; --bg: #FFFFFF; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); }

    .modal-box { width: 520px; background: white; border-radius: 32px; padding: 48px; box-shadow: 0 40px 100px rgba(0,0,0,0.3); text-align: center; position: relative; animation: modalUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes modalUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .close-btn { position: absolute; top: 24px; right: 24px; color: #6B7280; cursor: pointer; border: none; background: none; }

    h2 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1.5px; }
    p { color: #6B7280; margin-bottom: 40px; font-size: 16px; }

    .gate-btn { width: 100%; display: flex; align-items: center; gap: 20px; padding: 24px; border-radius: 20px; border: 1.5px solid #E5E7EB; background: white; text-decoration: none; color: var(--primary); font-weight: 700; margin-bottom: 16px; transition: all 0.2s; text-align: left; }
    .gate-btn:hover { border-color: var(--accent); background: #F0F7FF; transform: scale(1.02); }
    .gate-btn i { color: var(--accent); }
    
    .role-title { font-size: 18px; margin-bottom: 4px; }
    .role-desc { font-size: 13px; font-weight: 500; color: #6B7280; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="modal-box">
    <button class="close-btn" onclick="window.location.href='../../index.html'"><i data-lucide="x"></i></button>
    
    <div style="width: 64px; height: 64px; background: #F0F7FF; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
      <i data-lucide="user-plus" style="color: var(--accent); width: 32px; height: 32px;"></i>
    </div>
    
    <h2>Join Sutura</h2>
    <p>Select how you want to use the platform.</p>

    <a href="02-register.html" class="gate-btn">
      <div style="width: 48px; height: 48px; background: #EEF2FF; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i data-lucide="store" style="width: 24px;"></i>
      </div>
      <div>
        <div class="role-title">Shop Owner</div>
        <div class="role-desc">Digitize your tailoring business, manage staff, and track every order with precision.</div>
      </div>
    </a>

    <a href="05-designer-register.html" class="gate-btn">
      <div style="width: 48px; height: 48px; background: #EEF2FF; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i data-lucide="palette" style="width: 24px;"></i>
      </div>
      <div>
        <div class="role-title">Fashion Designer</div>
        <div class="role-desc">Showcase your portfolio, collaborate with verified shops, and take custom orders.</div>
      </div>
    </a>

    <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
      Already have an account? <a href="01-login.html" style="color: var(--accent); font-weight: 700; text-decoration: none;">Sign in here</a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
