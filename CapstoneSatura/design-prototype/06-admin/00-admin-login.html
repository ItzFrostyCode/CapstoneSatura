<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1.0">
  <title>Sutura | Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { 
      --bg: #09090B; 
      --card: rgba(18, 18, 23, 0.8);
      --accent: #3B82F6; 
      --text: #FAFAFA;
      --text-dim: #A1A1AA;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Outfit', sans-serif; 
      background: 
        radial-gradient(circle at top, rgba(59,130,246,0.08), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(168,85,247,0.06), transparent 18%),
        var(--bg); 
      color: var(--text); 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      letter-spacing: -0.02em;
    }

    .login-card { 
      width: 420px; 
      padding: 48px; 
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      text-align: left;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      text-decoration: none;
      color: white;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: white;
      color: black;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }

    h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.05em; }
    p.subtitle { color: var(--text-dim); font-size: 15px; margin-bottom: 32px; font-weight: 500; }

    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
    
    input { 
      width: 100%; 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 14px 16px; 
      color: white; 
      font-size: 15px; 
      transition: all 0.2s;
    }
    input:focus { border-color: var(--accent); outline: none; background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12); }

    .btn-submit { 
      width: 100%; 
      background: var(--accent); 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 15px; 
      cursor: pointer; 
      transition: all 0.2s;
      margin-top: 12px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .btn-submit:hover { background: #2563EB; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35); }
    .btn-submit:active { transform: translateY(0); }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-card">
    <a href="../index.html" class="logo">
      <div class="logo-icon"><i data-lucide="scissors" style="width: 20px;"></i></div>
      <div class="logo-text">Sutura Admin</div>
    </a>

    <h1>Sign in</h1>
    <p class="subtitle">Platform administration and analytics.</p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" placeholder="admin@sutura.com" value="admin@sutura.com">
    </div>

    <div class="form-group">
      <label>Access Key</label>
      <input type="password" placeholder="••••••••" value="••••••••">
    </div>

    <button class="btn-submit" onclick="window.location.href='01-admin-dashboard.html'">Enter Control Center</button>

    <div class="footer">
      Protected by Sutura Identity. <br><br>
      <a href="../index.html">Return to Website</a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
