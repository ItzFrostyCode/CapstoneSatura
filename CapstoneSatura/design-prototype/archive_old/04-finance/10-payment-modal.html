<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Sutura - Record Payment</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #1A1A1A; --bg: #FFFFFF; --surface: #F9FAFB;
      --text-main: #111827; --text-muted: #6B7280; --border: #E5E7EB;
      --accent: #2C6BED;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .modal {
      background: var(--bg);
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .modal-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { font-size: 20px; font-weight: 700; }
    .close-btn { cursor: pointer; color: var(--text-muted); }

    .modal-body { padding: 32px; }

    .summary-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
    }
    .summary-item .label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .summary-item .value { font-size: 18px; font-weight: 700; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    input, select, textarea {
      width: 100%; height: 48px; padding: 0 16px; border: 1.5px solid var(--border); border-radius: 12px;
      font-family: 'Outfit'; font-size: 15px; outline: none; background: var(--surface); transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); background: white; }
    textarea { height: 100px; padding: 12px 16px; resize: none; }

    .modal-footer {
      padding: 24px 32px;
      background: var(--surface);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn { padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; font-family: 'Outfit'; }
    .btn-secondary { background: white; border: 1.5px solid var(--border); color: var(--text-main); }
    .btn-primary { background: var(--primary); color: white; }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-header">
      <h2>Record Payment</h2>
      <i data-lucide="x" class="close-btn" onclick="history.back()"></i>
    </div>
    
    <div class="modal-body">
      <div class="summary-box">
        <div class="summary-item">
          <div class="label">Invoice Total</div>
          <div class="value">₱12,500.00</div>
        </div>
        <div class="summary-item" style="text-align: right;">
          <div class="label">Balance Due</div>
          <div class="value" style="color: #DC2626;">₱5,000.00</div>
        </div>
      </div>

      <div class="form-group">
        <label>Amount Paid (₱)</label>
        <input type="number" placeholder="0.00" value="5000" />
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select>
          <option>Cash</option>
          <option>GCash / E-Wallet</option>
          <option>Bank Transfer</option>
          <option>Check</option>
        </select>
      </div>

      <div class="form-group">
        <label>Payment Date</label>
        <input type="date" value="2026-04-25" />
      </div>

      <div class="form-group">
        <label>Reference Note (Optional)</label>
        <textarea placeholder="e.g. Transaction ID, Check number..."></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="history.back()">Cancel</button>
      <button class="btn btn-primary" onclick="alert('Payment recorded!'); history.back();">Confirm Payment</button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
