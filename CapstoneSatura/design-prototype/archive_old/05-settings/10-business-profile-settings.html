<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Sutura - Manage Shop Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #1A1A1A; --bg: #FFFFFF; --surface: #F9FAFB;
      --text-main: #111827; --text-muted: #6B7280; --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--surface); color: var(--text-main); display: flex; min-height: 100vh; }

    .sidebar { width: 260px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .main { flex-grow: 1; padding: 40px; }

    .card { background: white; border-radius: 24px; border: 1px solid var(--border); padding: 40px; max-width: 800px; }
    
    .logo-upload { width: 100px; height: 100px; border-radius: 24px; background: var(--surface); border: 2px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 32px; }
    
    .form-group { margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    input, textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-family: 'Outfit'; font-size: 15px; outline: none; background: var(--bg); }
    
    .btn-save { background: var(--primary); color: white; border: none; padding: 16px 32px; border-radius: 16px; font-weight: 800; cursor: pointer; }
    
    /* Portal Preview Card */
    .preview-card { border: 1px solid #FDE68A; background: #FFFBEB; border-radius: 16px; padding: 20px; display: flex; gap: 16px; align-items: center; margin-top: 32px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div style="padding: 24px; font-weight: 800; font-size: 20px;">Sutura</div>
    <nav style="padding: 24px;">
      <a href="01-settings-tab.html" style="display: flex; align-items: center; gap: 12px; color: var(--text-muted); text-decoration: none; font-weight: 600; padding: 12px;"><i data-lucide="arrow-left"></i> Back to Settings</a>
    </nav>
  </aside>

  <main class="main">
    <div style="margin-bottom: 32px;">
      <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -1.5px;">Shop Profile Management</h1>
      <p style="color: var(--text-muted);">Configure your shop's public identity (UC_M01).</p>
    </div>

    <div class="card">
      <label>Shop Logo</label>
      <div class="logo-upload">
        <i data-lucide="camera" style="color: var(--text-muted);"></i>
        <span style="font-size: 10px; font-weight: 800; margin-top: 4px; color: var(--text-muted);">UPLOAD</span>
      </div>

      <div class="form-group">
        <label>Shop Name</label>
        <input type="text" value="La Belle Couture" />
      </div>

      <div class="form-group">
        <label>Physical Address</label>
        <textarea>123 Fashion Ave, Makati City, Metro Manila</textarea>
      </div>

      <div class="form-group">
        <label>Google Maps Embedded Link</label>
        <input type="text" placeholder="https://maps.google.com/..." value="https://goo.gl/maps/la-belle-couture" />
      </div>

      <div class="form-group">
        <label>Contact Phone</label>
        <input type="text" value="+63 912 345 6789" />
      </div>

      <button class="btn-save">Save Shop Profile</button>

      <div class="preview-card">
        <div style="background: #F59E0B; color: white; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><i data-lucide="eye"></i></div>
        <div>
          <div style="font-size: 14px; font-weight: 800; color: #92400E;">Portal Preview</div>
          <div style="font-size: 12px; color: #B45309;">This info will be visible to your customers in the <a href="../01-clients-crm/18-customer-public-portal.html" style="font-weight: 700; color: inherit;">Customer Portal</a>.</div>
        </div>
      </div>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
