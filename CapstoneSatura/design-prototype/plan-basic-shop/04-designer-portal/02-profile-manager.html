<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1440, initial-scale=1.0">
  <title>Sutura - Profile Settings</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #111827; 
      --bg: #FAFAFA; 
      --surface: #FFFFFF;
      --text-main: #1F2937; 
      --text-muted: #6B7280; 
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

    /* ── Minimalist Sidebar ── */
    .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 32px; flex-shrink: 0; }
    .brand { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 48px; letter-spacing: -0.5px; }
    .nav-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; margin-top: 32px; }
    .nav-list { display: flex; flex-direction: column; gap: 8px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; font-size: 15px; font-weight: 500; color: var(--text-main); text-decoration: none; transition: all 0.2s; }
    .nav-item i { width: 18px; color: var(--text-muted); transition: color 0.2s; }
    .nav-item:hover { background: #F3F4F6; }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item.active i { color: white; }

    /* ── Main Content ── */
    .main { flex-grow: 1; display: flex; flex-direction: column; }
    .header { height: 90px; display: flex; align-items: center; justify-content: flex-end; padding: 0 48px; background: var(--bg); }
    .user-profile { display: flex; align-items: center; gap: 16px; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
    .user-name { font-weight: 600; font-size: 14px; }

    .content { padding: 0 48px 48px; max-width: 800px; width: 100%; margin: 0 auto; }

    .page-title { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
    .page-desc { font-size: 15px; color: var(--text-muted); margin-bottom: 48px; }

    /* Form Container */
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px; }
    
    .avatar-upload { display: flex; align-items: center; gap: 24px; margin-bottom: 40px; }
    .avatar-preview { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
    .btn-secondary { background: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: #F9FAFB; }

    .form-group { margin-bottom: 24px; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], textarea { width: 100%; padding: 16px; border-radius: 8px; border: 1px solid var(--border); font-family: 'Outfit', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; background: var(--bg); }
    input[type="text"]:focus, textarea:focus { border-color: var(--primary); background: white; }
    textarea { height: 120px; resize: none; }

    .specialty-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .tag { background: #F3F4F6; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .tag i { width: 12px; cursor: pointer; }

    .btn-save { background: var(--primary); color: white; border: none; padding: 16px 32px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; width: 100%; transition: opacity 0.2s; }
    .btn-save:hover { opacity: 0.9; }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">Sutura Studio</div>
    
    <div class="nav-label">Community</div>
    <nav class="nav-list">
      <a href="06-explore-feed.html" class="nav-item"><i data-lucide="compass"></i> Explore Designs</a>
    </nav>

    <div class="nav-label">Workspace</div>
    <nav class="nav-list">
      <a href="01-designer-dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a href="03-design-post-creator.html" class="nav-item"><i data-lucide="pen-tool"></i> Create Post</a>
      <a href="04-product-publisher.html" class="nav-item"><i data-lucide="send"></i> Publish to Shop</a>
    </nav>

    <div class="nav-label">Identity</div>
    <nav class="nav-list">
      <a href="05-portfolio-gallery.html" class="nav-item"><i data-lucide="image"></i> View Portfolio</a>
      <a href="02-profile-manager.html" class="nav-item active"><i data-lucide="user"></i> Profile Settings</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="header">
      <div class="user-profile">
        <span class="user-name">Elena Rossi</span>
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=150" alt="Avatar" class="user-avatar">
      </div>
    </header>

    <div class="content">
      <h1 class="page-title">Profile Settings</h1>
      <p class="page-desc">Manage your public portfolio identity and specialties.</p>

      <div class="form-card">
        
        <div class="avatar-upload">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=300" alt="Avatar" class="avatar-preview">
          <div>
            <button class="btn-secondary" style="margin-bottom: 8px;">Upload New Photo</button>
            <p style="font-size: 12px; color: var(--text-muted);">Recommended 500x500px JPG or PNG.</p>
          </div>
        </div>

        <div class="form-group">
          <label>Display Name</label>
          <input type="text" value="Elena Rossi">
        </div>

        <div class="form-group">
          <label>Professional Title</label>
          <input type="text" value="Senior Fashion Designer">
        </div>

        <div class="form-group">
          <label>Professional Bio</label>
          <textarea placeholder="Tell your story...">Specializing in avant-garde evening wear and bespoke tailoring. Over 10 years of experience bringing intricate designs to life.</textarea>
        </div>

        <div class="form-group">
          <label>Design Specialties</label>
          <input type="text" placeholder="Type a specialty and press enter...">
          <div class="specialty-tags">
            <span class="tag">Evening Wear <i data-lucide="x"></i></span>
            <span class="tag">Bridal <i data-lucide="x"></i></span>
            <span class="tag">Streetwear <i data-lucide="x"></i></span>
          </div>
        </div>

        <button class="btn-save">Save Profile Updates</button>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
    
    // Simulate Save Profile Updates (UML Sequence step)
    document.querySelector('.btn-save').addEventListener('click', function() {
      this.textContent = 'Saving...';
      this.style.opacity = '0.7';
      setTimeout(() => {
        this.innerHTML = '<i data-lucide="check" style="width: 18px; margin-right: 8px;"></i> Updates Confirmed';
        this.style.background = '#059669';
        this.style.opacity = '1';
        lucide.createIcons();
        setTimeout(() => {
          this.innerHTML = 'Save Profile Updates';
          this.style.background = 'var(--primary)';
        }, 3000);
      }, 1000);
    });
  </script>
</body>
</html>
