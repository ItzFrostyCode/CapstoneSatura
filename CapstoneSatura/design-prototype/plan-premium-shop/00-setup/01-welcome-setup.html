<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sutura - Welcome</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #1A1A1A;
      --primary-hover: #333333;
      --bg: #FFFFFF;
      --surface: #F9FAFB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --accent: #2C6BED;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--surface);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .welcome-card {
      width: 100%;
      max-width: 600px;
      background: var(--bg);
      border-radius: 32px;
      padding: 60px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .confetti-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .icon-container {
      width: 80px;
      height: 80px;
      background: #F0FDF4;
      color: #16A34A;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      margin: 0 auto 32px;
      position: relative;
      z-index: 1;
    }

    .icon-container::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      border: 2px solid #16A34A;
      border-radius: 24px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: var(--primary);
    }

    p {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 48px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 48px;
    }

    .step {
      width: 40px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      transition: all 0.3s;
    }

    .step.active {
      width: 80px;
      background: var(--primary);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-primary {
      width: 100%;
      height: 60px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .btn-secondary {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-secondary:hover {
      color: var(--primary);
    }

    /* Floating elements */
    .float {
      position: absolute;
      opacity: 0.1;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <div class="icon-container">
      <i data-lucide="check-circle-2" style="width: 40px; height: 40px;"></i>
    </div>

    <h1>Congratulations!</h1>
    <p>Your account has been successfully validated by our admin team. You are now part of the Sutura premium network.</p>

    <div class="step-indicator">
      <div class="step active"></div>
      <div class="step"></div>
      <div class="step"></div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="window.location.href='02-role-assignment.html'">
        Set Up Your Team
        <i data-lucide="arrow-right" style="width: 20px;"></i>
      </button>
      <button class="btn-secondary" onclick="window.location.href='../01-dashboard.html'">
        Skip to Dashboard
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    // Add some random floating icons for flair
    const icons = ['scissors', 'ruler', 'palette', 'needle'];
    for(let i=0; i<10; i++) {
      const div = document.createElement('div');
      div.className = 'float';
      div.style.top = Math.random() * 100 + '%';
      div.style.left = Math.random() * 100 + '%';
      div.style.transform = `rotate(${Math.random() * 360}deg) scale(${0.5 + Math.random()})`;
      div.innerHTML = `<i data-lucide="${icons[Math.floor(Math.random()*icons.length)]}"></i>`;
      document.body.appendChild(div);
    }
    lucide.createIcons();
  </script>
</body>
</html>
