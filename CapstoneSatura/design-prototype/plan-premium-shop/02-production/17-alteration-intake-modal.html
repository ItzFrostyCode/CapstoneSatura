<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Sutura - New Alteration Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #1A1A1A; --primary-hover: #333333;
      --bg: #FFFFFF; --surface: #F9FAFB;
      --text-main: #111827; --text-muted: #6B7280; --border: #E5E7EB;
      --accent: #F97316; /* Orange for Alterations/Fixes */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: rgba(0,0,0,0.5); height: 100vh; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

    .modal { background: white; width: 680px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .modal-body { padding: 32px; overflow-y: auto; max-height: 70vh; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    select, input, textarea { width: 100%; height: 48px; border: 1.5px solid var(--border); border-radius: 12px; padding: 0 16px; font-family: 'Outfit'; font-size: 15px; outline: none; background: var(--surface); }
    textarea { height: 80px; padding: 12px 16px; }

    .alteration-types { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .alt-chip { padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .alt-chip.active { border-color: var(--accent); background: #FFF7ED; color: var(--accent); }

    .modal-footer { padding: 24px 32px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
    .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><i data-lucide="scissors"></i> Alteration Intake</div>
      <a href="01-job-orders-tab.html" style="color: var(--text-muted);"><i data-lucide="x"></i></a>
    </div>
    
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Customer</label>
          <select><option>Liza Soberano</option><option>Enrique Gil</option></select>
        </div>
        <div class="form-group">
          <label>Original Order Ref (Optional)</label>
          <input type="text" placeholder="e.g. ORD-1005" />
        </div>
      </div>

      <label>Type of Alteration</label>
      <div class="alteration-types">
        <div class="alt-chip active">Hemming</div>
        <div class="alt-chip">Waist Adjustment</div>
        <div class="alt-chip">Sleeve Shortening</div>
        <div class="alt-chip">Repair / Patching</div>
        <div class="alt-chip">Resizing (Full)</div>
      </div>

      <div class="form-group">
        <label>Detailed Issue Description</label>
        <textarea placeholder="e.g. Hem is too long by 2 inches, needs tapered finish."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Urgency Level</label>
          <select>
            <option>Standard (5-7 Days)</option>
            <option style="color: #D97706;">Rush (2-3 Days) +20% Fee</option>
            <option style="color: #DC2626;">Express (24 Hours) +50% Fee</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estimated Charge</label>
          <input type="text" value="₱450.00" style="font-weight: 800; color: var(--primary);" />
        </div>
      </div>

      <div class="form-group">
        <label>Add Photo of Issue</label>
        <div style="border: 2px dashed var(--border); border-radius: 16px; padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px;">
          <i data-lucide="camera" style="width: 24px; margin-bottom: 8px;"></i>
          <div>Click to upload or drag & drop</div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <a href="01-job-orders-tab.html" class="btn-secondary">Cancel</a>
      <button class="btn-primary" onclick="alert('Alteration Job Order Created!'); window.location.href='01-job-orders-tab.html'">Create Alteration Order</button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
