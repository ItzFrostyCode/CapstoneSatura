<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Supplier Portal | Sutura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --primary: #1A1A1A; --accent: #2C6BED; --bg: #F9FAFB; --surface: #FFFFFF; --border: #E5E7EB; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
    
    .header { background: white; padding: 20px 80px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .main { flex: 1; padding: 40px 80px; display: grid; grid-template-columns: 1fr 400px; gap: 40px; }
    
    .card { background: white; border-radius: 24px; padding: 32px; border: 1.5px solid var(--border); }
    .section-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px; background: var(--bg); font-size: 12px; font-weight: 700; color: #6B7280; text-transform: uppercase; }
    td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    
    .btn { padding: 12px 24px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
    .btn-primary { background: var(--primary); color: white; }
    
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; }
  </style>
</head>
<body>

  <header class="header">
    <div style="font-size: 24px; font-weight: 900;">Sutura <span style="color: var(--accent);">SUPPLY</span></div>
    <div style="font-weight: 700;">Global Fabrics Inc. (Supplier)</div>
  </header>

  <main class="main">
    <div class="card">
      <h3 class="section-title">Pending Purchase Orders</h3>
      <table>
        <thead>
          <tr><th>Shop</th><th>Items</th><th>Qty</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><b>La Belle Couture</b></td>
            <td>Charcoal Wool</td>
            <td>5 Rolls</td>
            <td><span style="color: #D97706; font-weight: 800;">Pending</span></td>
            <td><button class="btn btn-primary" onclick="alert('Delivery Recorded!')">Ship Now</button></td>
          </tr>
          <tr>
            <td><b>Eleganza Shops</b></td>
            <td>Silk Lining</td>
            <td>12 Meters</td>
            <td><span style="color: #10B981; font-weight: 800;">Processing</span></td>
            <td><button class="btn btn-primary" style="opacity: 0.5;">Mark Shipped</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3 class="section-title">Record Stock Delivery</h3>
      <p style="font-size: 14px; color: #6B7280; margin-bottom: 24px;">Use this to log deliveries that don't have a PO yet.</p>
      <div class="form-group">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px;">Target Shop</label>
        <input type="text" placeholder="Search Shop Name">
      </div>
      <div class="form-group">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px;">Item Category</label>
        <input type="text" placeholder="e.g. Textiles">
      </div>
      <div class="form-group">
        <label style="display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px;">Proof of Delivery (No.)</label>
        <input type="text" placeholder="POD-XXXXX">
      </div>
      <button class="btn btn-primary" style="width: 100%;">Log Delivery</button>
    </div>
  </main>

  <script>lucide.createIcons();</script>
</body>
</html>
