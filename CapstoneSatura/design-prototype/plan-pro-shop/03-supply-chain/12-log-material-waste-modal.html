<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1.0" />
  <title>Sutura - Log Material Waste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #1A1A1A; --primary-hover: #333333;
      --bg: #FFFFFF; --surface: #F9FAFB;
      --text-main: #111827; --text-muted: #6B7280; --border: #E5E7EB;
      --accent: #E11D48; /* Red for Waste */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: rgba(0,0,0,0.5); height: 100vh; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

    .modal { background: white; width: 540px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden; }
    .modal-header { padding: 24px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; }
    
    .modal-body { padding: 32px; }
    .form-group { margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    select, input, textarea { width: 100%; height: 48px; border: 1.5px solid var(--border); border-radius: 12px; padding: 0 16px; font-family: 'Outfit'; font-size: 15px; outline: none; background: var(--surface); }
    textarea { height: 80px; padding: 12px 16px; }

    .modal-footer { padding: 24px 32px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
    .btn-secondary { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-header">
      <div class="modal-title"><i data-lucide="trash-2"></i> Log Material Waste</div>
      <a href="01-inventory-tab.html" style="color: var(--text-muted);"><i data-lucide="x"></i></a>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Material Name</label>
        <select><option>Charcoal Wool Tweed</option><option>Pina Silk</option><option>Polyester Thread (White)</option></select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label>Quantity Wasted</label>
          <input type="number" step="0.01" value="0.5" id="wasteQty" />
        </div>
        <div class="form-group">
          <label>Unit</label>
          <input type="text" value="Meters" disabled style="background: #f3f4f6; color: #9ca3af;" />
        </div>
      </div>

      <!-- Optional Value Preview -->
      <div style="background: #FFFBEB; border: 1.5px solid #FDE68A; border-radius: 12px; padding: 16px; margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-size: 11px; font-weight: 700; color: #92400E; text-transform: uppercase;">Estimated Value Impact</div>
            <div style="font-size: 14px; color: #B45309; margin-top: 2px;">Unit Cost: ₱450.00 (from Supplier)</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 18px; font-weight: 800; color: #B45309;">₱225.00</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Reason for Waste</label>
        <select>
          <option>Cutting Error</option>
          <option>Fabric Damage / Stain</option>
          <option>Measurement Mismatch</option>
          <option>End of Roll (Unusable Scrap)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Additional Notes</label>
        <textarea placeholder="Describe how the waste occurred..."></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <a href="01-inventory-tab.html" class="btn-secondary">Cancel</a>
      <button class="btn-primary" onclick="alert('Waste logged and inventory adjusted.'); window.location.href='01-inventory-tab.html'">Log Waste & Update Stock</button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
